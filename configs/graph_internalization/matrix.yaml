primary_graph_teacher: depth_free
lambda_graph: 0.1
conditions:
  - rgb_action
  - rgbd_action
  - rgb_graph
  - rgbd_graph
data_seeds:
  - 101
  - 202
  - 303
holdout_manifests:
  101: manifests/depth_free_teacher_holdout_seed101.json
  202: manifests/depth_free_teacher_holdout_seed202.json
  303: manifests/depth_free_teacher_holdout_seed303.json
  404: manifests/depth_free_teacher_holdout_seed404.json
  505: manifests/depth_free_teacher_holdout_seed505.json
locked_lora_spec: reports/openvla_lora_locked_spec.yaml
locked_depth_spec: reports/current_depth_specification.json
locked_graph_teacher: reports/primary_graph_teacher.lock.json
checkpoint: outputs/scene_graph_generator_openvla_spatial/checkpoints/pooled_mlp_openvla_3d/best.pt
server_runner:
  launch_mode: tmux
  one_process_per_gpu: true
  overwrite_existing_runs: false
eval:
  smoke:
    tasks: 1
    rollouts_per_task: 5
  interim:
    tasks: 10
    rollouts_per_task: 10
  final:
    tasks: 10
    rollouts_per_task: 50
